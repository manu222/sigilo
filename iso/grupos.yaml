    - {name: "Git en GitHub", description: "github-cli y lazygit", selected: true, packages: [github-cli, lazygit], carpeta: "Desarrollo/Herramientas", terminal: [lazygit, gh]}
    - {name: "Docker", description: "Contenedores y compose", selected: true, packages: [docker, docker-compose, docker-buildx], carpeta: "Desarrollo/Contenedores", terminal: [lazydocker, docker]}
