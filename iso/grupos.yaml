- name: "Sigilo · copias del sistema"
  description: "Copia instantánea antes de cada actualización y arranque de copias desde GRUB. Solo sirve con btrfs."
  selected: true
  critical: false
  packages:
    - timeshift
    - timeshift-autosnap
    - grub-btrfs
    - inotify-tools
    - cronie

- name: "Desarrollo"
