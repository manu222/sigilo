# Aspecto de las aplicaciones GTK (Thunar, Seahorse, diálogos de archivos…).
# El tema pone la forma de los controles y los colores Sigilo se añaden
# encima en gtk.css. Al cambiar algo aquí, Mod+Shift+R lo pasa también a
# gsettings para las apps más nuevas (ver i3/scripts/import-gsettings).
[Settings]
# Tema base: el de GNOME moderno, adaptado a GTK3
gtk-theme-name=adw-gtk3-dark
# Papirus con las carpetas en menta (extra/iconos-sigilo.py)
gtk-icon-theme-name=Sigilo
# Letra de la interfaz; el código y los terminales van en JetBrains Mono
gtk-font-name=Inter 10
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=0
gtk-menu-images=0
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-application-prefer-dark-theme=1
# Los tres botones en las apps que dibujan su propia barra de titulo.
gtk-decoration-layout=:minimize,maximize,close
