; ============================================================================
;  Polybar - Sigilo Dark
;  Cada modulo es una pildora redondeada: las medias lunas %{T3}%{T-} %{T3}%{T-} son
;  glifos de Nerd Font pintados del color del fondo de la pildora, que es
;  como se consiguen esquinas curvas en una barra que no las soporta.
; ============================================================================

[colors]
bg        = #070b09
bg-alt    = #0a0f0d
surface   = #101714
pill      = #15201c
line      = #1a2320
raise     = #15201c
active    = #1b2723
fg        = #e7edea
fg-dim    = #94a3a0
fg-muted  = #70837c
accent    = #34d399
accent-hi = #3ee8a8
amber     = #c99d6b
red       = #e0777d
slate     = #8aa9c4
violet    = #b79ad4
cyan      = #6fc9c0
olive     = #b8c9a0

[bar/sigilo]
monitor          = ${env:MONITOR:}
bottom           = false
width            = 96.6%
offset-x         = 1.7%
offset-y         = 14
height           = 40
radius           = 16

; El fondo de la barra va mas oscuro que las pildoras: asi se ven en relieve.
background       = #d9080d0b
foreground       = ${colors.fg-dim}

padding          = 1
module-margin    = 1
line-size        = 2pt
border-size      = 1pt
border-color     = #26332e
separator        =

font-0 = JetBrainsMono Nerd Font:style=Regular:size=10;2
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;2
; fuente solo para las tapas de las pildoras: tiene que ser tan alta
; como la barra o quedan medialunas enanas en un hueco oscuro
font-2 = JetBrainsMono Nerd Font:size=27;6
; fuente solo para los iconos: a 10pt no caben los detalles de un
; chip, un termometro o una pila y salen partidos
font-3 = JetBrainsMono Nerd Font Mono:size=15;3

modules-left   = i3
modules-center = app
modules-right  = pulseaudio backlight wlan eth temperature cpu memory battery date systray

cursor-click      = pointer
enable-ipc        = true
override-redirect = true
wm-restack        = i3

[settings]
screenchange-reload = true
pseudo-transparency = false
format-foreground = ${colors.fg-dim}

; -- escritorios --
[module/i3]
type = internal/i3
pin-workspaces   = true
show-urgent      = true
strip-wsnumbers  = true
index-sort       = true
enable-click     = true
enable-scroll    = false
format = <label-state><label-mode>

label-mode = %{B-}%{F#c99d6b}%{T3}%{T-}%{B#c99d6b}%{F#070b09} %mode% %{B-}%{F#c99d6b}%{T3}%{T-}%{F-}

label-focused   = %{B-}%{F#34d399}%{T3}%{T-}%{B#34d399}%{F#06130d} %name% %{B-}%{F#34d399}%{T3}%{T-}%{F-}
label-focused-padding = 0

label-visible   = %{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F#94a3a0} %name% %{B-}%{F#15201c}%{T3}%{T-}%{F-}
label-visible-padding = 0

label-unfocused = %{F#556760}  %name%  %{F-}
label-unfocused-padding = 0

label-urgent    = %{B-}%{F#e0777d}%{T3}%{T-}%{B#e0777d}%{F#070b09} %name% %{B-}%{F#e0777d}%{T3}%{T-}%{F-}
label-urgent-padding = 0

; -- aplicacion con el foco --
; El titulo de la ventana crece sin control y desborda la barra; el nombre
; de la aplicacion es corto y estable. Lo saca un script que escucha los
; eventos de i3, asi que se actualiza al instante y sin sondear.
[module/app]
type = custom/script
exec = /home/manu/.config/i3/scripts/app-enfocada
tail = true
format = <label>
label = %output%
label-foreground = ${colors.fg-dim}

; -- titulo completo de la ventana (sin usar, por si lo quieres de vuelta) --
[module/xwindow]
type = internal/xwindow
label = %title:0:14:…%
label-foreground = ${colors.fg-muted}

; -- volumen --
[module/pulseaudio]
type = internal/pulseaudio
interval = 5
use-ui-max = false
format-volume = %{A3:pavucontrol:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} <ramp-volume> <label-volume> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}
format-muted  = %{A3:pavucontrol:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} <label-muted> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}
label-volume  = %percentage%%
label-volume-foreground = ${colors.fg-dim}
ramp-volume-0 = %{F#34d399}%{T4}%{T-}%{F-}
ramp-volume-1 = %{F#34d399}%{T4}%{T-}%{F-}
ramp-volume-2 = %{F#34d399}%{T4}%{T-}%{F-}
label-muted = %{F#70837c}%{T4}%{T-}%{F-} %{F#70837c}--%{F-}

; -- brillo --
[module/backlight]
type = internal/backlight
card = ${env:BACKLIGHT:intel_backlight}
use-actual-brightness = true
enable-scroll = true
format = %{A4:/home/manu/.config/polybar/scripts/brillo.sh up:}%{A5:/home/manu/.config/polybar/scripts/brillo.sh down:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} %{F#c99d6b}%{T4}%{T-}%{F-} <label> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}%{A}
label = %percentage%%
label-foreground = ${colors.fg-dim}

; -- wifi --
[module/wlan]
type = internal/network
interface = wlan0
interface-type = wireless
interval = 3
format-connected = %{A1:/home/manu/.config/rofi/scripts/wifi:}%{A3:/home/manu/.config/i3/scripts/terminal --titulo Redes --tam 90x26 -- nmtui:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} <ramp-signal> <label-connected> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}%{A}
label-connected  = %essid:0:12:...%
label-connected-foreground = ${colors.fg-dim}
ramp-signal-0 = %{F#6fc9c0}%{T4}%{T-}%{F-}
ramp-signal-1 = %{F#6fc9c0}%{T4}%{T-}%{F-}
ramp-signal-2 = %{F#6fc9c0}%{T4}%{T-}%{F-}
format-disconnected = %{A1:/home/manu/.config/rofi/scripts/wifi:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} %{F#e0777d}%{T4}%{T-}%{F-} <label-disconnected> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}
label-disconnected  = sin red
label-disconnected-foreground = ${colors.fg-muted}

; -- cable --
[module/eth]
type = internal/network
interface = enp6s0f1
interval = 3
format-connected = %{A1:/home/manu/.config/rofi/scripts/wifi:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} %{F#8aa9c4}%{T4}%{T-}%{F-} <label-connected> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}
label-connected  = %local_ip%
label-connected-foreground = ${colors.fg-dim}
format-disconnected =

; -- temperatura --
[module/temperature]
type = internal/temperature
hwmon-path       = ${env:TEMP_PATH}
base-temperature = 45
warn-temperature = 82
interval = 3
format      = %{A1:/home/manu/.config/polybar/scripts/sistema.sh:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} <ramp> <label> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}
format-warn = %{A1:/home/manu/.config/polybar/scripts/sistema.sh:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} <ramp> <label-warn> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}
label       = %temperature-c%
label-foreground = ${colors.fg-dim}
label-warn  = %temperature-c%
label-warn-foreground = ${colors.red}
ramp-0 = %{F#8aa9c4}%{T4}%{T-}%{F-}
ramp-1 = %{F#c99d6b}%{T4}%{T-}%{F-}
ramp-2 = %{F#e0777d}%{T4}%{T-}%{F-}

; -- cpu --
[module/cpu]
type = internal/cpu
interval = 2
format = %{A1:/home/manu/.config/polybar/scripts/sistema.sh:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} %{F#8aa9c4}%{T4}%{T-}%{F-} <label> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}
label = %percentage:2%%
label-foreground = ${colors.fg-dim}

; -- memoria --
[module/memory]
type = internal/memory
interval = 3
format = %{A1:/home/manu/.config/polybar/scripts/sistema.sh:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} %{F#b79ad4}%{T4}%{T-}%{F-} <label> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}
label = %gb_used%
label-foreground = ${colors.fg-dim}

; -- bateria --
[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
poll-interval = 5
low-at = 15
format-charging    = %{A1:/home/manu/.config/polybar/scripts/bateria.sh:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} <animation-charging> <label-charging> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}
format-discharging = %{A1:/home/manu/.config/polybar/scripts/bateria.sh:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} <ramp-capacity> <label-discharging> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}
format-full        = %{A1:/home/manu/.config/polybar/scripts/bateria.sh:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} %{F#34d399}%{T4}%{T-}%{F-} <label-full> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}
format-low         = %{A1:/home/manu/.config/polybar/scripts/bateria.sh:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} <ramp-capacity> <label-low> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}
label-charging    = %percentage%%
label-charging-foreground = ${colors.fg-dim}
label-discharging = %percentage%%
label-discharging-foreground = ${colors.fg-dim}
label-full        = 100%
label-full-foreground = ${colors.fg-dim}
label-low         = %percentage%%
label-low-foreground  = ${colors.red}
ramp-capacity-0 = %{F#e0777d}%{T4}%{T-}%{F-}
ramp-capacity-1 = %{F#c99d6b}%{T4}%{T-}%{F-}
ramp-capacity-2 = %{F#c99d6b}%{T4}%{T-}%{F-}
ramp-capacity-3 = %{F#b8c9a0}%{T4}%{T-}%{F-}
ramp-capacity-4 = %{F#34d399}%{T4}%{T-}%{F-}
animation-charging-0 = %{F#34d399}%{T4}%{T-}%{F-}
animation-charging-1 = %{F#34d399}%{T4}%{T-}%{F-}
animation-charging-2 = %{F#34d399}%{T4}%{T-}%{F-}
animation-charging-3 = %{F#34d399}%{T4}%{T-}%{F-}
animation-charging-4 = %{F#34d399}%{T4}%{T-}%{F-}
animation-charging-framerate = 750

; -- reloj --
[module/date]
type = internal/date
interval = 1
date     = %d %b
date-alt = %A, %d de %B de %Y
time     = %H:%M
time-alt = %H:%M:%S
format = %{A3:/home/manu/.config/polybar/scripts/calendario:}%{B-}%{F#15201c}%{T3}%{T-}%{B#15201c}%{F-} %{F#34d399}%{T4}%{T-}%{F-} <label> %{B-}%{F#15201c}%{T3}%{T-}%{F-}%{A}
label = %date%  %time%
label-foreground = ${colors.fg}

; -- bandeja del sistema --
[module/systray]
type = internal/tray
tray-padding = 10pt
tray-spacing = 8pt
tray-size = 58%
; Transparente: la bandeja se apoya en el fondo de la barra. Meterla
; en una pildora obliga a modulos postizos que descuadran el ancho.
tray-background = #00000000

