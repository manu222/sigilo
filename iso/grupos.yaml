# Aplicaciones de Sigilo, por grupos.
#
# Este fichero es la única lista. Lo leen:
#   · extra/sigilo-apps      para instalar o añadir apps en un equipo ya hecho
#   · iso/construir-iso.sh   que lo convierte en la pantalla de paquetes del
#                            instalador (formato «netinstall» de Calamares)
#
# Cada app va en su propio subgrupo para que salga con su casilla.
# «a|b» significa: usa «a» si existe y, si no, «b» (los nombres cambian a
# veces entre el AUR y los repositorios oficiales). Del AUR, mejor las
# versiones «-bin»: vienen ya compiladas y no arrastran compilaciones de horas.
# «pipx:nombre» es una herramienta de Python que no está empaquetada: se
# instala con pipx para el usuario.
# Los drivers no están aquí: los decide iso/detectar-hardware según el equipo.
#
# Campos propios de Sigilo (el instalador los ignora):
#   carpeta:   dónde aparece en ~/Aplicaciones y en el menú de la barra
#   terminal:  herramientas de terminal a las que se les crea un acceso
#              (se abren en kitty con su chuleta de uso)

