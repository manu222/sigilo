# ============================================================================
#  hypridle · qué pasa cuando no tocas el equipo
#  Los mismos tiempos que en i3 (xset s 600 dpms 620 + xss-lock):
#    10 min      se bloquea
#    10 min 20 s se apagan las pantallas
#  Con un vídeo o un juego a pantalla completa no pasa nada de esto
#  (regla "sin-reposo-a-pantalla-completa" en sigilo/reglas.lua).
# ============================================================================

general {
    # Una sola pantalla de bloqueo aunque se pida varias veces
    lock_cmd = pidof hyprlock || hyprlock
    # Bloquear antes de suspender, para que al volver ya esté bloqueado
    before_sleep_cmd = loginctl lock-session
    # Al volver de la suspensión, encender las pantallas sin tener que
    # pulsar una tecla dos veces
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 620
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
