# ============================================================================
#  hyprlock · pantalla de bloqueo de Sigilo en Hyprland
#  Se parece a la de i3 (i3/scripts/bloqueo): el escritorio difuminado y
#  oscurecido, el sello en el centro, la hora y la fecha debajo.
#  Se abre con Super+Shift+X, desde el menú de sesión o sola a los 10 min.
#  Colores: los de sigilo/colores.lua, escritos a mano porque este fichero
#  no puede leer los de Lua.
# ============================================================================

general {
    hide_cursor = true
    # Si una contraseña falla, el aviso se va a los 2 s
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = sigilo, 0.2, 0.9, 0.1, 1
    animation = fadeIn, 1, 3, sigilo
    animation = fadeOut, 1, 2, sigilo
    animation = inputFieldColors, 1, 2, sigilo
}

# Fondo: una foto del escritorio al bloquear, difuminada y oscurecida.
# (En i3 lo mismo se hacía con scrot + magick; aquí lo hace hyprlock.)
background {
    monitor =
    path = screenshot
    color = rgb(070b09)
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
    vibrancy = 0.1
}

# El sello, algo por encima del centro (como SUBE=60 en el script de i3)
image {
    monitor =
    path = ~/.config/i3/sello-bloqueo.png
    size = 300
    rounding = 0
    border_size = 0
    position = 0, 60
    halign = center
    valign = center
}

# Hora
label {
    monitor =
    text = $TIME
    color = rgb(e7edea)
    font_size = 52
    font_family = JetBrains Mono
    position = 0, -170
    halign = center
    valign = center
}

# Fecha en español (el locale lo fija la sesión, ver sigilo/entorno.lua)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d de %B"
    color = rgb(94a3a0)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, -225
    halign = center
    valign = center
}

# Contraseña: una línea discreta bajo la fecha. Menta al escribir, cian
# mientras comprueba y rojo si falla, como el anillo de i3lock.
input-field {
    monitor =
    size = 260, 44
    outline_thickness = 2
    rounding = 22
    dots_size = 0.22
    dots_spacing = 0.35
    outer_color = rgba(34d39966)
    inner_color = rgba(15201ccc)
    font_color = rgb(e7edea)
    font_family = JetBrains Mono
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text =
    check_color = rgb(6fc9c0)
    fail_color = rgb(e0777d)
    fail_text = <span foreground="##e0777d">no es esa</span>
    capslock_color = rgb(c99d6b)
    position = 0, -290
    halign = center
    valign = center
}
