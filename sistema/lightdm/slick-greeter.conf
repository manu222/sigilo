# Pantalla de inicio de sesion - tema Sigilo
# Se instala en /etc/lightdm/slick-greeter.conf con sistema/instalar-acceso.sh

[Greeter]
# El fondo es el mismo que el del escritorio, para que entrar sea continuo.
# Tiene que estar fuera de /home: lightdm corre con su propio usuario y no
# puede leer tu carpeta personal. El script «fondo» lo va actualizando.
background=@FONDO@
background-color=#070b09
draw-user-backgrounds=false
draw-grid=false

# La caja de acceso usa el mismo tema GTK que el resto del sistema
theme-name=adw-gtk3-dark
icon-theme-name=Papirus-Dark
cursor-theme-name=Bibata-Modern-Classic
cursor-theme-size=24
font-name=JetBrains Mono 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb

# El sello en la esquina, en vez del logotipo de la distribucion
logo=/usr/share/backgrounds/sigilo-sello.png
other-monitors-logo=

clock-format=%A %-d de %B   %H:%M
show-clock=true
show-hostname=true
show-power=true
show-quit=true
show-a11y=false
show-keyboard=false
round-user-image=true
