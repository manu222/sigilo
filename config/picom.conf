# Picom - transparencia sutil y sombras, ajustado para no cargar la GTX 1050.

backend = "glx";
vsync = true;
use-damage = true;
# Las ventanas a pantalla completa (vídeos, juegos) se saltan el compositor:
# menos trabajo para la gráfica y sin retardo añadido.
unredir-if-possible = true;

# ── sombras ──
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.60;
shadow-offset-x = -22;
shadow-offset-y = -14;
shadow-color = "#000000";
shadow-exclude = [
  "class_g = 'i3-frame'",
  "_GTK_FRAME_EXTENTS@",
  "window_type = 'desktop'"
];

# ── transparencia ──
# Solo pierden opacidad las ventanas SIN foco, para localizar la activa.
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
inactive-dim = 0.0;

opacity-rule = [
  "100:class_g = 'firefox'",
  "100:class_g = 'Brave-browser'",
  "100:class_g = 'Chromium'",
  "100:fullscreen",
  "100:class_g = 'Polybar'",
  "100:window_type = 'desktop'"
];

# ── desvanecidos ──
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
fade-exclude = [];

# ── varios ──
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
# Esquinas redondeadas en las ventanas, a juego con la barra.
corner-radius = 8;
# La barra se redondea aquí, con más radio que las ventanas. Si lo hiciera
# polybar, pintaría las esquinas con una copia del fondo y con fondos claros
# o animados se verían esquinas de color.
corner-radius-rules = [
  "16:class_g = 'Polybar'"
];
rounded-corners-exclude = [
  "window_type = 'desktop'",
  # A pantalla completa no se redondea nada: se verian muescas negras.
  "_NET_WM_STATE@[0] = '_NET_WM_STATE_FULLSCREEN'",
  "_NET_WM_STATE@[1] = '_NET_WM_STATE_FULLSCREEN'"
];
mark-wmwin-focused = true;
mark-ovredir-focused = true;

wintypes:
{
  dock          = { shadow = true; };
  dnd           = { shadow = false; };
  tooltip       = { fade = true; shadow = false; focus = true; opacity = 1.0; };
  popup_menu    = { opacity = 1.0; shadow = true; };
  dropdown_menu = { opacity = 1.0; shadow = true; };
  notification  = { shadow = true; };
};


# ── animaciones ─────────────────────────────────────────────────────────────
# Soportadas por picom a partir de la version 12. Si tu picom es anterior,
# picom no arrancara y habra que quitar este bloque (esta la copia
# picom.conf.sin-animaciones al lado).
#
# Duraciones cortas a proposito: por debajo de 200 ms se percibe como
# respuesta del sistema; por encima, como espera.

animations = (
  {
    triggers = [ "open", "show" ];
    preset   = "appear";
    duration = 0.16;
    scale    = 0.97;
  },
  {
    triggers = [ "close", "hide" ];
    preset   = "disappear";
    duration = 0.13;
    scale    = 0.97;
  },
  {
    # al recolocarse por el mosaico, que se deslice en vez de saltar
    triggers = [ "geometry" ];
    preset   = "geometry-change";
    duration = 0.14;
  }
)
