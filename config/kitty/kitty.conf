# ─────────────────────────────────────────────────────────────
#  Kitty · Sigilo
#  Menta para lo que tiene el foco, lila apagado para lo que no.
# ─────────────────────────────────────────────────────────────

# ── Letra ────────────────────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          10.5
modify_font        cell_height 112%
disable_ligatures  cursor

# Los iconos (los de eza en «lt», los de la chuleta, starship…) ya vienen
# dentro de JetBrainsMono Nerd Font: el paquete ttf-jetbrains-mono-nerd
# lleva las tandas nuevas (Codicons, Seti, Material…), así que no hace
# falta mandar ningún rango a otra fuente con «symbol_map». Si algún día
# salen cuadraditos, lo primero es mirar que el kitty sea nuevo (los
# cambios de letra solo se cogen al abrir otra ventana) y que nadie haya
# dejado un bloque «BEGIN_KITTY_FONTS» al final de este fichero: lo añade
# el selector de «kitty +list-fonts» y manda sobre lo de arriba.

# ── Ventana ──────────────────────────────────────────────────
window_padding_width   10 16
hide_window_decorations yes
confirm_os_window_close 0
background_opacity     0.94
dynamic_background_opacity yes
remember_window_size   no
initial_window_width   96c
initial_window_height  28c
enable_audio_bell      no
visual_bell_duration   0.0

# ── Cursor ───────────────────────────────────────────────────
cursor_shape           block
cursor_blink_interval  0
# Estela corta al saltar de sitio; ayuda a no perder el cursor
cursor_trail           3
cursor_trail_decay     0.08 0.25
cursor_trail_start_threshold 4

# ── Texto y ratón ────────────────────────────────────────────
scrollback_lines       20000
mouse_hide_wait        2.0
url_style              curly
detect_urls            yes
copy_on_select         no
strip_trailing_spaces  smart
select_by_word_characters @-./_~?&=%+#

# ── Pestañas ─────────────────────────────────────────────────
tab_bar_edge           top
tab_bar_margin_height  6 2
tab_bar_style          powerline
tab_powerline_style    round
tab_bar_min_tabs       2
tab_title_template     " {index} {title[:28]} "
active_tab_font_style  bold
inactive_tab_font_style normal

# ── Paneles ──────────────────────────────────────────────────
enabled_layouts        splits, stack
window_border_width    1pt
window_margin_width    2
inactive_text_alpha    0.82

# ── Paleta ───────────────────────────────────────────────────
foreground             #e7edea
background             #0a0f0d
selection_foreground   #f2eefa
selection_background   #2c2342
cursor                 #34d399
cursor_text_color      #070b09
url_color              #c8aae5

active_border_color    #3ee8a8
inactive_border_color  #1b2723
bell_border_color      #c99d6b

tab_bar_background     #0a0f0d
active_tab_foreground  #06130d
active_tab_background  #34d399
inactive_tab_foreground #9d8cc2
inactive_tab_background #15201c

mark1_foreground       #070b09
mark1_background       #b79ad4

# negro
color0   #15201c
color8   #556760
# rojo
color1   #e0777d
color9   #f08b91
# verde
color2   #34d399
color10  #3ee8a8
# amarillo
color3   #c99d6b
color11  #dcae76
# azul
color4   #8aa9c4
color12  #9bbad6
# lila
color5   #b79ad4
color13  #c8aae5
# cian
color6   #6fc9c0
color14  #7bdcd2
# blanco
color7   #94a3a0
color15  #e7edea

# ── Atajos ───────────────────────────────────────────────────
# Pestañas y paneles abren en la misma carpeta que el actual
map ctrl+shift+t       new_tab_with_cwd
map ctrl+shift+enter   launch --location=hsplit --cwd=current
map ctrl+shift+\       launch --location=vsplit --cwd=current
map ctrl+shift+left    neighboring_window left
map ctrl+shift+right   neighboring_window right
map ctrl+shift+up      neighboring_window up
map ctrl+shift+down    neighboring_window down
map ctrl+shift+z       toggle_layout stack
# Transparencia al vuelo
map ctrl+shift+a>m     set_background_opacity +0.04
map ctrl+shift+a>l     set_background_opacity -0.04
map ctrl+shift+a>d     set_background_opacity default
